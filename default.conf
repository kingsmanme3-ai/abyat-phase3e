map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 160m;     # رفع الفيديو (الحد الفعلي يضبطه الخادم: 15 MB للصور و150 MB للفيديو)

    # الواجهة الثابتة (المرحلة 2)
    root /usr/share/nginx/html;
    index index.html;

    # الخطوط: كاش طويل، ولا تُرجَع index.html عند غياب الملف
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # رفع الوسائط (3ج): دون تخزين الطلب كاملاً في nginx، ومهلة أطول للفيديو
    location = /api/media {
        proxy_pass http://api:8000;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # الـ API والتوثيق وفحص الصحة
    location ~ ^/(api/|health$|docs|redoc|openapi\.json$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # التحديث اللحظي (WebSocket)
    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
